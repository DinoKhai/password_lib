<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Library</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero-panel">
        <div class="hero-title-block">
          <h1>
            <span class="app-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path
                  d="M5 4.5h9.5a3 3 0 0 1 3 3v11.5H8a3 3 0 0 0-3 3V4.5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 19H19V7.5a3 3 0 0 0-3-3H6.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
                <path
                  d="M10.5 10.5a2 2 0 1 1 3.1 1.66v1.34"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <circle cx="12" cy="16" r="0.9" fill="currentColor" />
              </svg>
            </span>
            Password Library
          </h1>
          <p class="hero-copy" id="library-summary">0 entries</p>
        </div>
        <div class="hero-actions">
          <button type="button" class="primary-button" id="new-entry-button">
            <span class="button-icon-inline" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M10 4.5v11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                <path d="M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </span>
            <span>New entry</span>
          </button>
          <div class="header-links">
            <button type="button" class="header-link-button" id="export-button">
              <span class="header-link-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" focusable="false">
                  <path d="M10 3v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <path d="m6.8 8.8 3.2 3.2 3.2-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M4 14.5h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </span>
              <span>Export</span>
            </button>
            <button type="button" class="header-link-button" id="import-button">
              <span class="header-link-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" focusable="false">
                  <path d="M10 17V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <path d="m6.8 11.2 3.2-3.2 3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M4 5.5h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </span>
              <span>Import</span>
            </button>
          </div>
          <input id="import-input" class="hidden-input" type="file" accept=".xlsx,.xls" />
        </div>
        <button
          type="button"
          class="theme-icon-btn"
          id="theme-toggle"
          title="Switch to light mode"
          aria-label="Switch to light mode"
        >
          <span id="theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </header>

      <section class="banner hidden" id="notification" aria-live="polite"></section>

      <section class="editor-shell hidden" id="editor-shell">
        <form class="editor-panel" id="entry-form">
          <div class="panel-header">
            <h2 class="form-heading" id="form-title">New entry</h2>
            <button type="button" class="icon-button form-close-btn" id="clear-button" aria-label="Cancel" title="Cancel">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="15" height="15" aria-hidden="true">
                <path d="M5 5l10 10M15 5L5 15"/>
              </svg>
            </button>
          </div>

          <label class="field-group" for="title-input">
            <span>Title</span>
            <input id="title-input" placeholder="Example: Personal Email" required />
          </label>

          <label class="field-group" for="username-input">
            <span>Username</span>
            <input id="username-input" placeholder="name@example.com" />
          </label>

          <div class="field-group">
            <span>Password</span>
            <div class="password-field">
              <input id="password-input" type="password" placeholder="Enter password" autocomplete="new-password" />
              <button type="button" class="icon-button" id="toggle-draft-password" aria-label="Show password" title="Show password">
                <span class="eye-icon" id="draft-eye-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <label class="field-group" for="notes-input">
            <span>Notes</span>
            <textarea id="notes-input" rows="4" placeholder="Add reminders, URLs, or recovery notes"></textarea>
          </label>

          <div class="field-group">
            <div class="section-heading">
              <span>Additional sections</span>
              <button type="button" class="secondary-button" id="add-section-button">
                <span class="button-icon-inline" aria-hidden="true">
                  <svg viewBox="0 0 20 20" focusable="false">
                    <path d="M10 4.5v11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                    <path d="M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                  </svg>
                </span>
                <span>Add section</span>
              </button>
            </div>
            <div class="custom-field-list" id="custom-fields"></div>
          </div>

          <button type="submit" class="primary-button" id="save-button">Save entry</button>
        </form>
      </section>

      <section class="workspace">
        <section class="library-panel">
          <div class="panel-header">
            <div class="library-heading">
              <h2>
                <span class="heading-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" focusable="false">
                    <rect x="3.5" y="4" width="13" height="12" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path d="M6.5 8h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M6.5 11h4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                </span>
                <span>All passwords</span>
              </h2>
            </div>
            <label class="search-box" for="search-input">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" focusable="false">
                  <circle cx="8.5" cy="8.5" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <path d="m12 12 4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </span>
              <input
                id="search-input"
                type="search"
                placeholder="Search title, username, or notes"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
          </div>

          <div class="entry-list" id="entry-list"></div>
        </section>
      </section>
    </main>
    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
